name: Build and Release Windows Agent

on:
  push:
    tags:
      - 'v*' # Сборка запустится автоматически, когда вы создадите тег версии (v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # Исправлено: версия изменена на актуальную из go.mod

      # НОВЫЙ ШАГ: Подтягиваем и кэшируем все внешние библиотеки (wmi и др.)
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download

      # Исправлено: Добавлен флаг фонового режима -H=windowsgui
      - name: Build Windows Executable
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o windows-hardware-agent.exe main.go

      # Загрузка готового бинарника прямо в релизы GitHub
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-hardware-agent.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
